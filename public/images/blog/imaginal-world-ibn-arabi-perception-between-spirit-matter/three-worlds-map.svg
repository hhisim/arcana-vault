<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10121c"/><stop offset="1" stop-color="#090b12"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f1d9a9"/><stop offset="1" stop-color="#a9814c"/></linearGradient><radialGradient id="center"><stop stop-color="#c2a56f" stop-opacity=".24"/><stop offset="1" stop-color="#c2a56f" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="800" cy="465" r="390" fill="url(#center)"/><text x="800" y="116" fill="#e9dfcc" font-family="Georgia,serif" font-size="42" text-anchor="middle" letter-spacing="5">THREE MODES OF PERCEPTION</text><text x="800" y="163" fill="#9e96a9" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" letter-spacing="3">A READING MAP OF THE IMAGINAL WORLD</text><g fill="#171b29" stroke="url(#gold)" stroke-width="2"><rect x="105" y="330" width="390" height="260" rx="24"/><rect x="605" y="285" width="390" height="350" rx="26"/><rect x="1105" y="330" width="390" height="260" rx="24"/></g><g fill="#e8dcc5" font-family="Georgia,serif" text-anchor="middle"><text x="300" y="425" font-size="31" letter-spacing="3">SENSIBLE</text><text x="300" y="469" font-size="31" letter-spacing="3">WORLD</text><text x="800" y="410" font-size="34" letter-spacing="3">IMAGINAL</text><text x="800" y="456" font-size="34" letter-spacing="3">WORLD</text><text x="1300" y="425" font-size="31" letter-spacing="3">SPIRITUAL</text><text x="1300" y="469" font-size="31" letter-spacing="3">WORLD</text></g><g fill="#bcb3a5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><text x="300" y="525">embodied forms</text><text x="800" y="510">images with their own reality</text><text x="1300" y="525">intelligible meanings</text></g><g stroke="#c9a86a" stroke-width="3" fill="none"><path d="M495 460H595"/><path d="M1005 460H1105"/><path d="M570 450l25 10-